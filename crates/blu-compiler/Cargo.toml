[package]
name = "blu-compiler"
description = "Blu-owned compiler slice and explicit legacy Luau compiler adapter"
keywords = ["lua", "luau", "compiler", "scripting", "ffi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
legacy-luau = ["dep:cc", "dep:luau0-src"]

[dependencies]
blu-bytecode.workspace = true
blu-core.workspace = true
blu-syntax.workspace = true
sha2.workspace = true

[build-dependencies]
cc = { version = "1.2", optional = true }
luau0-src = { version = "=0.20.7", optional = true }

[dev-dependencies]
blu-runtime.workspace = true
